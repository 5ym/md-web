<!doctype html>
<html lang="ja">

	<head>
		<meta charset="utf-8">
		<title>markdown preview</title>
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<link rel="stylesheet" href="styles.css">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css">
		<style>
			html,body {
				height: 100%;
			}
			body {
				margin: 0;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
			}
			#app {
				display: flex;
				box-sizing: border-box;
				height: 100%;
				padding: 1vw;
			}
			#editors {
				display: flex;
				flex: 1 1 0;
				flex-direction: column;
				min-width: 0;
				margin-right: 1vw;
				transition: all 0.2s;
			}
			#editors > .pane {
				flex: 1 1 0;
				min-height: 0;
				overflow: hidden;
			}
			#editors > .pane + .pane {
				margin-top: 1vw;
			}
			#css-pane {
				display: none;
			}
			.cm-editor {
				height: 100%;
			}
			.cm-editor.cm-focused {
				outline: none;
			}
			#preview {
				flex: 1 1 0;
				min-width: 0;
				overflow: auto;
			}
			/* highlight.js paints its own background; keep GitHub's block styling */
			#preview pre code.hljs {
				padding: 0;
				background: transparent;
			}

			body.no-editor #editors {
				flex: 0 0 0;
				margin-right: 0;
				opacity: 0;
			}
			body.with-css #css-pane {
				display: block;
			}

			#toolbar {
				position: fixed;
				right: 1vw;
				bottom: 1vw;
				display: flex;
				gap: 0.5vw;
			}
			#toolbar button {
				min-width: 3vw;
				height: 3vw;
				padding: 0 0.5vw;
				border: none;
				border-radius: 0.3vw;
				outline: none;
				background: #D50000;
				color: white;
				font-family: inherit;
				font-size: 1.6vw;
				line-height: 1;
				opacity: 0.2;
				cursor: pointer;
				transition: all 0.2s;
			}
			#toolbar button:hover {
				opacity: 1;
			}
			#toolbar button[aria-pressed="true"] {
				opacity: 0.7;
			}

			@page {
				margin: 15mm;
			}
			@media print {
				html,body {
					height: auto;
				}
				#toolbar,#editors {
					display: none !important;
				}
				#app {
					display: block;
					height: auto;
					padding: 0;
				}
				#preview {
					overflow: visible;
				}
				#preview table {
					display: table;
					overflow: visible;
				}
				#preview pre,#preview code {
					white-space: pre-wrap;
					word-break: break-all;
				}
			}
		</style>
		<script type="importmap">
		{
			"imports": {
				"codemirror": "https://esm.sh/codemirror@6.0.2",
				"@codemirror/lang-markdown": "https://esm.sh/@codemirror/lang-markdown@6.5.1",
				"@codemirror/lang-css": "https://esm.sh/@codemirror/lang-css@6.3.1",
				"@codemirror/theme-one-dark": "https://esm.sh/@codemirror/theme-one-dark@6.1.3",
				"marked": "https://esm.sh/marked@18.0.7",
				"marked-highlight": "https://esm.sh/marked-highlight@2.2.4",
				"highlight.js": "https://esm.sh/highlight.js@11.11.1/lib/common"
			}
		}
		</script>
	</head>

	<body>
		<main id="app">
			<div id="editors">
				<div class="pane" id="input"></div>
				<div class="pane" id="css-pane"></div>
			</div>
			<div id="preview"></div>
		</main>
		<style id="user-css"></style>
		<div id="toolbar">
			<button id="toggle-css" type="button" aria-pressed="false" title="CSSエディタ">CSS</button>
			<button id="toggle-editor" type="button" title="エディタを隠す">←</button>
			<button id="print" type="button" title="印刷 / PDFに保存">↓</button>
		</div>

		<script type="module">
			import { EditorView, basicSetup } from "codemirror";
			import { markdown } from "@codemirror/lang-markdown";
			import { css } from "@codemirror/lang-css";
			import { oneDark } from "@codemirror/theme-one-dark";
			import { Marked } from "marked";
			import { markedHighlight } from "marked-highlight";
			import hljs from "highlight.js";

			const marked = new Marked(markedHighlight({
				emptyLangClass: "hljs",
				langPrefix: "hljs language-",
				highlight(code, lang) {
					const language = hljs.getLanguage(lang) ? lang : "plaintext";
					return hljs.highlight(code, { language }).value;
				}
			}));

			const preview = document.querySelector("#preview");
			const userCss = document.querySelector("#user-css");

			// re-render on the next frame so a burst of keystrokes costs one parse
			function debounce(fn) {
				let queued = false;
				return () => {
					if (queued) return;
					queued = true;
					requestAnimationFrame(() => {
						queued = false;
						fn();
					});
				};
			}

			function onChange(fn) {
				const run = debounce(fn);
				return EditorView.updateListener.of(update => {
					if (update.docChanged) run();
				});
			}

			const mdEditor = new EditorView({
				doc: "# markdown preview\n\n左に markdown を書くと、右に GitHub 風の表示が出ます。\n",
				parent: document.querySelector("#input"),
				extensions: [
					basicSetup,
					markdown(),
					oneDark,
					EditorView.lineWrapping,
					onChange(() => {
						preview.innerHTML = marked.parse(mdEditor.state.doc.toString());
					})
				]
			});

			const cssEditor = new EditorView({
				doc: "/* ここに書いた CSS がプレビューと印刷に反映されます */\n"
					+ "@page {\n"
					+ "  size: A4;\n"
					+ "  margin: 15mm;\n"
					+ "}\n"
					+ "#preview h1 {\n"
					+ "  /* page-break-before: always; */\n"
					+ "}\n",
				parent: document.querySelector("#css-pane"),
				extensions: [
					basicSetup,
					css(),
					oneDark,
					EditorView.lineWrapping,
					onChange(() => {
						userCss.textContent = cssEditor.state.doc.toString();
					})
				]
			});

			preview.innerHTML = marked.parse(mdEditor.state.doc.toString());
			userCss.textContent = cssEditor.state.doc.toString();

			const toggleEditor = document.querySelector("#toggle-editor");
			toggleEditor.addEventListener("click", () => {
				const hidden = document.body.classList.toggle("no-editor");
				toggleEditor.textContent = hidden ? "□" : "←";
				toggleEditor.title = hidden ? "エディタを表示" : "エディタを隠す";
			});

			const toggleCss = document.querySelector("#toggle-css");
			toggleCss.addEventListener("click", () => {
				const shown = document.body.classList.toggle("with-css");
				toggleCss.setAttribute("aria-pressed", String(shown));
				if (shown) cssEditor.requestMeasure();
			});

			document.querySelector("#print").addEventListener("click", () => window.print());

			// Ctrl/Cmd+P prints the preview even while the editor has focus
			window.addEventListener("keydown", event => {
				if ((event.ctrlKey || event.metaKey) && event.key === "p") {
					event.preventDefault();
					window.print();
				}
			});
		</script>
	</body>

</html>
